<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De.fault</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="df-surface">
  <div class="container">

    <header class="card-header">
      <img src="../icons/logo-white.png" alt="de.fault" class="logo-img">
      <p class="df-meta tagline">The Anti-Feed</p>
    </header>

    <main class="main">
      <div class="status-row" id="statusRow">
        <span class="dot dot-active"></span>
        <span class="df-body status-text">Ready</span>
      </div>

      <p class="df-body desc">
        De.fault reads your current page context to surface unexpected but meaningfully adjacent perspectives. Take a raw detour from your usual feed.
      </p>

      <div class="how-row">
        <div class="how-item">
          <span class="how-num df-eyebrow">01</span>
          <span class="df-meta how-text">Reads current page context</span>
        </div>
        <div class="how-item">
          <span class="how-num df-eyebrow">02</span>
          <span class="df-meta how-text">Detects your intent</span>
        </div>
        <div class="how-item">
          <span class="how-num df-eyebrow">03</span>
          <span class="df-meta how-text">Generates adjacent suggestions</span>
        </div>
      </div>
    </main>

    <footer class="bottom-bar">
      <a href="mailto:yoonbeebaek@gmail.com?subject=De.fault%20Feedback"
         class="df-link">Send Feedback</a>
      <span class="df-footer">2026 de.fault</span>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
